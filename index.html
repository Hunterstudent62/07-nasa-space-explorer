<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA worm logo" class="logo" />
      <div class="header-text">
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
        <p class="tagline">Browse NASA’s cosmic highlights by date range.</p>
      </div>
    </header>

    <section class="fact-box" aria-label="Random space fact">
      <p class="fact-label">Did You Know?</p>
      <p id="spaceFact" class="space-fact"></p>
    </section>

    <section class="controls-card" aria-label="Date range filters">
      <div class="filters">
        <div class="input-group">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" />
        </div>

        <div class="input-group">
          <label for="endDate">End Date</label>
          <input type="date" id="endDate" />
        </div>

        <div class="button-wrap">
          <button id="fetchButton" type="button">Get Space Images</button>
        </div>
      </div>

      <p id="statusMessage" class="status-message" aria-live="polite">
        Select a date range and click “Get Space Images” to explore the cosmos.
      </p>
    </section>

    <section>
      <div id="gallery" class="gallery">
        <div class="placeholder">
          <div class="placeholder-icon">🔭</div>
          <p>Select a date range and click “Get Space Images” to explore the cosmos.</p>
        </div>
      </div>
    </section>
  </div>

  <div id="imageModal" class="modal hidden" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content" role="document">
      <button id="closeModalButton" class="close-modal" type="button" aria-label="Close modal">×</button>
      <div id="modalMediaWrapper" class="modal-media-wrapper"></div>
      <div class="modal-text">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation" class="modal-explanation"></p>
        <a id="modalLink" class="media-link hidden" href="#" target="_blank" rel="noopener noreferrer">Open original media</a>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
